name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub release tag to attach DMGs to (e.g. desktop-v0.15.1)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize (admins only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actor is a repo admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission')
          echo "Actor '${ACTOR}' has permission: ${perm}"
          if [ "${perm}" != "admin" ]; then
            echo "::error::'${ACTOR}' is not a repo admin (permission=${perm}). Refusing to build."
            exit 1
          fi
          echo "Authorized: '${ACTOR}' is an admin."

  build:
    name: DMG (${{ matrix.arch }})
    needs: [authorize]
    if: |
      always() &&
      (needs.authorize.result == 'success' || needs.authorize.result == 'skipped') &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x64
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS DMG (${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          # Stage the correct node-pty prebuild for the target arch.
          npm_config_arch: ${{ matrix.arch }}
          # GitHub Actions interpolates absent secrets as "" — never pass those
          # through as CSC_LINK or electron-builder treats "" as a file path.
          CSC_LINK_RAW: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_RAW: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_RAW: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_RAW: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_NOTARY_PROFILE_RAW: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK_RAW}" ]; then
            echo "→ Apple signing secrets found; building signed DMG"
            export CSC_LINK="$CSC_LINK_RAW"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_RAW"
            [ -n "${APPLE_API_KEY_RAW}" ] && export APPLE_API_KEY="$APPLE_API_KEY_RAW"
            [ -n "${APPLE_API_KEY_ID_RAW}" ] && export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_RAW"
            [ -n "${APPLE_API_ISSUER_RAW}" ] && export APPLE_API_ISSUER="$APPLE_API_ISSUER_RAW"
            [ -n "${APPLE_NOTARY_PROFILE_RAW}" ] && export APPLE_NOTARY_PROFILE="$APPLE_NOTARY_PROFILE_RAW"
          else
            echo "→ No Apple signing secrets; building unsigned DMG (ad-hoc)"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist:mac:dmg -- --${{ matrix.arch }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: berdaya-macos-dmg-${{ matrix.arch }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  attach-release:
    name: Attach to GitHub Release
    needs: build
    if: |
      always() && needs.build.result == 'success' && (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: berdaya-macos-dmg-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for GitHub Release to exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG found"
              exit 0
            fi
            echo "Waiting for release $TAG... ($i/30)"
            sleep 10
          done
          echo "::error::Release $TAG not found after 5 minutes"
          exit 1

      - name: Upload DMGs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No DMG files found in dist/"
            ls -la dist/ || true
            exit 1
          fi
          echo "Uploading ${#files[@]} DMG(s) to release $TAG:"
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
